services:
  db:
    image: postgres:16-alpine
    container_name: saljip-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saljip}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saljip}
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_dev:
