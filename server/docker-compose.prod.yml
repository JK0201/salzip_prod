services:
  db:
    image: postgres:16-alpine
    container_name: saljip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-saljip}
    # 호스트 localhost만 노출 (DBeaver SSH 터널 접속용)
    # 외부 인터넷 차단 = Lightsail Firewall + 127.0.0.1 바인딩
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saljip}
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: saljip-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # compose 내부 통신 — db 서비스명으로 host 오버라이드
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-saljip}
    ports:
      # localhost only — Caddy(host)가 :8000으로 reverse proxy
      - '127.0.0.1:8000:8000'
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
